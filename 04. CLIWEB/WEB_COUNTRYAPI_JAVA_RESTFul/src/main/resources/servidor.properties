# Dirección del servidor RESTful de CountryAPI (ruta base /api) que consume el cliente web.
# Si el servidor está en otra PC, cambie solo la IP, por ejemplo:
#   servidor.url=http://192.168.1.20:8080/WS_COUNTRYAPI_JAVA_RESTFul/api
# Para cambiarla sin recompilar, cree un archivo con esta misma clave y apunte Payara a él:
#   asadmin create-system-properties countryapi.config=C\:/ruta/servidor.properties
servidor.url=http://localhost:8080/WS_COUNTRYAPI_JAVA_RESTFul/api
