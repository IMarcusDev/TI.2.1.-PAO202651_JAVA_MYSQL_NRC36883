# Conexión a MySQL del servidor CountryAPI.
# Valores pensados para el contenedor de "03. BDD/docker-compose.yml".
# Cambie estos valores y vuelva a empaquetar (mvn package) para usar otra base.
#
# sslMode=DISABLED: Payara instala su propio almacén de certificados en la JVM y la conexión
# TLS con MySQL falla («unknown_ca»). Para la base local de pruebas se desactiva TLS;
# allowPublicKeyRetrieval=true permite autenticar al usuario de MySQL 8 sin TLS.
# rewriteBatchedStatements=true agrupa los lotes de executeBatch en pocas sentencias.
db.url=jdbc:mysql://localhost:3306/api_paises?sslMode=DISABLED&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&connectTimeout=5000
db.usuario=root
db.clave=root
