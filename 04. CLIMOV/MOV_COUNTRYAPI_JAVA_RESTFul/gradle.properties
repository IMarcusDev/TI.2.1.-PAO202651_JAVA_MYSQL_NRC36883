android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Servidor RESTful de CountryAPI que la app usa por defecto. 10.0.2.2 es el equipo anfitrión visto
# desde el emulador; en un celular físico use la IP del servidor en la red local, por ejemplo
# http://192.168.1.20:8080/WS_COUNTRYAPI_JAVA_RESTFul/api. También se cambia desde la app.
servidor=http://10.0.2.2:8080/WS_COUNTRYAPI_JAVA_RESTFul/api
